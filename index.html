<script>
const CONFIG = {
  brandName: "[ 𝐗 𝐍𝐎𝐁𝐈𝐓𝐀 ]",
  bannerImageUrl: "https://tmpfiles.org/dl/wNAXTWlwTQYw/x-nobita.jpeg",
  ownerNumber: "12843422459",
  ownerName: "𝐗 𝐍𝐎𝐁𝐈𝐓𝐀",
  channelLink: "https://whatsapp.com/channel/0029VbDtZiW4dTnQtGld7D0e",
  backendUrl: "https://web-production-4abfe.up.railway.app"
};
</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pair your bot</title>
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --surface:#131a33; --surface2:#1a2344; --line:#27325e;
  --text:#eef1ff; --muted:#93a0cf; --accent:#4cc9ff; --accent2:#ff5fa2;
  --ok:#3ddc97; --bad:#ff6b6b;
  --radius:18px;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Space Grotesk','Sora',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  min-height:100vh;line-height:1.5;
  background-image:radial-gradient(600px 400px at 85% -5%,rgba(76,201,255,.16),transparent 70%),
                   radial-gradient(500px 380px at -10% 20%,rgba(255,95,162,.13),transparent 70%);
  background-attachment:fixed;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface);position:relative}
.hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface2)}
.hero .meta{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.brand{font-size:clamp(1.5rem,7vw,2rem);font-weight:800;letter-spacing:.01em;word-break:break-word;line-height:1.15}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.owner{color:var(--muted);font-size:.85rem}
.owner b{color:var(--text);font-weight:600}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on{color:var(--ok)} .status.on .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
.status.off{color:var(--bad)} .status.off .dot{background:var(--bad)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat strong{display:block;font-family:var(--mono);font-size:1.6rem;font-weight:700;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:1.15rem;font-weight:700}
.panel p.sub{color:var(--muted);font-size:.85rem;margin-top:-8px}
.fields{display:flex;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600}
.cc{width:84px;flex:none}
.num{flex:1;min-width:0}
input{
  width:100%;font:inherit;font-size:1rem;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:14px;outline:none;font-family:var(--mono);
  transition:border-color .15s,box-shadow .15s;
}
input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,201,255,.2)}
.err{color:var(--bad);font-size:.82rem;min-height:1.1em}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{
  width:100%;padding:15px;border-radius:12px;font-weight:700;font-size:1rem;color:#06101f;
  background:linear-gradient(135deg,var(--accent),#8ae0ff);transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.result{display:none;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:6px;border-top:1px dashed var(--line)}
.result.show{display:flex;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.code{font-family:var(--mono);font-weight:700;font-size:clamp(2rem,11vw,2.8rem);letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.timer{font-size:.85rem;color:var(--muted)}
.timer b{font-family:var(--mono);color:var(--text)}
.timer.expired b{color:var(--bad)}
.copy{padding:11px 22px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:.9rem}
.hint{font-size:.78rem;color:var(--muted);max-width:32ch}
.join{
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  padding:15px;border-radius:14px;font-weight:700;color:var(--text);
  border:1px solid var(--accent2);background:rgba(255,95,162,.1);
}
.toasts{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{max-width:420px;width:100%;padding:13px 16px;border-radius:12px;font-size:.88rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pop .25s ease-out}
.toast.error{border-color:var(--bad);color:#ffd0d0}
.toast.success{border-color:var(--ok);color:#c9f7e2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <img id="banner" alt="" width="460" height="259">
    <div class="meta">
      <h1 class="brand" id="brandName"></h1>
      <div class="row">
        <p class="owner">Owner: <b id="ownerName"></b></p>
        <span class="status" id="status"><i class="dot"></i><span id="statusText">Checking…</span></span>
      </div>
    </div>
  </header>

  <section class="stats" aria-label="Live statistics">
    <div class="stat"><strong id="sUsers">–</strong><span>Total users</span></div>
    <div class="stat"><strong id="sSessions">–</strong><span>Connected sessions</span></div>
    <div class="stat"><strong id="sDaily">–</strong><span>New today</span></div>
    <div class="stat"><strong id="sPaired">–</strong><span>Total paired</span></div>
  </section>

  <section class="panel">
    <h2>Link your WhatsApp</h2>
    <p class="sub">Enter your number to get an 8-character pairing code.</p>
    <div class="fields">
      <label class="cc">Country code<input id="cc" inputmode="numeric" autocomplete="off" value="92" maxlength="4"></label>
      <label class="num">Phone number<input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="3111728383"></label>
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="go">Get Pairing Code</button>

    <div class="result" id="result" aria-live="polite">
      <div class="code" id="code"></div>
      <p class="timer" id="timer">Expires in <b id="left">0:00</b></p>
      <button class="copy" id="copy">Copy code</button>
      <p class="hint">On WhatsApp, open Linked devices, choose Link with phone number, and enter this code.</p>
    </div>
  </section>

  <a class="join" id="channel" target="_blank" rel="noopener">Join the channel</a>
</main>
<div class="toasts" id="toasts"></div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var API = CONFIG.backendUrl.replace(/\/+$/,'');

  document.title = CONFIG.brandName + " – Pair your bot";
  $('brandName').textContent = CONFIG.brandName;
  $('ownerName').textContent = CONFIG.ownerName;
  $('banner').src = CONFIG.bannerImageUrl;
  $('banner').alt = CONFIG.brandName + " banner";
  $('banner').onerror = function(){this.style.display='none'};
  $('channel').href = CONFIG.channelLink;

  function toast(msg, type){
    var t = document.createElement('div');
    t.className = 'toast ' + (type||'');
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(function(){t.remove()}, 4000);
  }

  function setErr(m){ $('err').textContent = m || ''; }

  /* Health + stats */
  function health(){
    fetch(API + '/api/health', {headers:{'Content-Type':'application/json'}})
      .then(function(r){return r.json()})
      .then(function(d){ setStatus(d && d.status === 'ok'); })
      .catch(function(){ setStatus(false); });
  }
  function setStatus(on){
    var s = $('status');
    s.className = 'status ' + (on ? 'on' : 'off');
    $('statusText').textContent = on ? 'Online' : 'Offline';
  }
  function fmt(n){ return Number(n).toLocaleString(); }
  function stats(){
    fetch(API + '/api/stats', {headers:{'Content-Type':'application/json'}})
      .then(function(r){return r.json()})
      .then(function(d){
        if(!d || d.ok !== true) return;
        $('sUsers').textContent = fmt(d.totalUsers);
        $('sSessions').textContent = fmt(d.activeSessions);
        $('sDaily').textContent = fmt(d.dailyNew);
        $('sPaired').textContent = fmt(d.totalPaired);
      })
      .catch(function(){});
  }
  health(); stats();
  setInterval(stats, 30000);
  setInterval(health, 30000);

  /* Countdown */
  var tick = null, endAt = 0, current = '';
  function render(){
    var s = Math.max(0, Math.round((endAt - Date.now())/1000));
    $('left').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
    if(s === 0){
      clearInterval(tick);
      $('timer').classList.add('expired');
      $('timer').innerHTML = 'Code expired. <b>Request a new one.</b>';
    }
  }
  function showCode(code, secs){
    current = code;
    $('code').textContent = code.length === 8 ? code.slice(0,4) + '-' + code.slice(4) : code;
    $('timer').classList.remove('expired');
    $('timer').innerHTML = 'Expires in <b id="left">0:00</b>';
    $('result').classList.add('show');
    endAt = Date.now() + (Number(secs)||120) * 1000;
    clearInterval(tick);
    render();
    tick = setInterval(render, 1000);
  }

  /* Copy */
  $('copy').addEventListener('click', function(){
    if(!current) return;
    var done = function(){ toast('Code copied', 'success'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(current).then(done, fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = current; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy, select the code manually', 'error'); }
      ta.remove();
    }
  });

  /* Pair */
  var busy = false;
  function digits(v){ return String(v).replace(/\D/g,''); }
  $('cc').addEventListener('input', function(){ this.value = digits(this.value); });
  $('phone').addEventListener('input', function(){ setErr(''); });
  $('phone').addEventListener('keydown', function(e){ if(e.key === 'Enter') pair(); });
  $('go').addEventListener('click', pair);

  function pair(){
    if(busy) return;
    var number = digits($('cc').value) + digits($('phone').value);
    if(number.length < 10 || number.length > 15){
      var m = 'Enter a valid number: 10 to 15 digits including the country code.';
      setErr(m); toast(m, 'error'); return;
    }
    setErr('');
    busy = true;
    $('go').disabled = true; $('go').textContent = 'Generating...';
    fetch(API + '/api/pair', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        number: number,
        brand: {
          name: CONFIG.brandName,
          banner: CONFIG.bannerImageUrl,
          owner: CONFIG.ownerNumber,
          ownerName: CONFIG.ownerName,
          channel: CONFIG.channelLink
        }
      })
    })
    .then(function(r){ return r.json().catch(function(){return {}}).then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(x){
      if(x.ok && x.d.code){
        showCode(String(x.d.code), x.d.expiresIn);
        toast('Pairing code ready', 'success');
      } else {
        var msg = (x.d && x.d.error) || 'Could not generate a code, please try again';
        setErr(msg); toast(msg, 'error');
      }
    })
    .catch(function(){
      var m = 'Could not reach server, please try again';
      setErr(m); toast(m, 'error');
    })
    .then(function(){
      busy = false; $('go').disabled = false; $('go').textContent = 'Get Pairing Code';
    });
  }
})();
</script>
</body>
</html>
